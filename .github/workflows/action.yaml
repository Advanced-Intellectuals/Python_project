name: publish

on:
  push:
    branches:
      - main

jobs:
  build-and-push-backend:
    environment: Main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        env:
          SSL_CERT: ${{ secrets.SSL_CERT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build \
            --build-arg SSL_CERT=${SSL_CERT} \
            --build-arg SSL_KEY=${SSL_KEY} \
            -f Dockerfile.back \
            -t ${DOCKER_USERNAME}/cinema-backend \
            .
      
      - name: Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker push ${DOCKER_USERNAME}/cinema-backend

    
  build-and-push-frontend:
    environment: Main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        env:
          SSL_CERT: ${{ secrets.SSL_CERT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build \
            --build-arg SSL_CERT=${SSL_CERT} \
            --build-arg SSL_KEY=${SSL_KEY} \
            -f Dockerfile.front \
            -t ${DOCKER_USERNAME}/cinema-frontend \
            .
      
      - name: Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker push ${DOCKER_USERNAME}/cinema-frontend
  

  build-and-push-ml:
    environment: Main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        env:
          SSL_CERT: ${{ secrets.SSL_CERT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build \
            --build-arg SSL_CERT=${SSL_CERT} \
            --build-arg SSL_KEY=${SSL_KEY} \
            -f Dockerfile.ml \
            -t ${DOCKER_USERNAME}/cinema-ml \
            .
      
      - name: Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker push ${DOCKER_USERNAME}/cinema-ml


  deploy-to-server:
    environment: Main
    runs-on: ubuntu-latest
    needs: [build-and-push-frontend, build-and-push-backend, build-and-push-ml]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: SSH into server and deploy using Docker Compose
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD}}
        run: |
          ssh -o StrictHostKeyChecking=no -p 2225 tim@185.105.91.138 "
            cd Movies &&
            docker login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD} &&
            docker-compose pull &&
            docker-compose up -d --build"